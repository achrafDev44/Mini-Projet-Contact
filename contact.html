<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez notre salle de sport pour obtenir des informations sur nos services et nos activités.">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="image/logo.png" alt="logo Fitness Club">
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Contactez-nous</h1>

        <section id="form-section">
            <form id="contact-form" action="#" method="post">

                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required class="highlight" aria-required="true" >

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required aria-required="true">

                <label for="msg">Message</label>
                <textarea id="msg" name="msg" rows="5" required class="highlight" aria-required="true"></textarea>

                <button type="submit">Envoyer</button>

                <p id="palindrome-error" class="error" hidden role="alert">Le message ne doit pas être un palindrome de plus de 5 caractères.</p>
            </form>
        </section>
    </main>

    <footer>
        mentions légales
    </footer>
<script src="js/palindrome.js"></script>    
</body>
</html>
